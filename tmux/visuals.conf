# Colours
set-option -g @foreground "default"
set-option -g @background "default"

# Status Bar
## Position
set-option -g status-position top
set-option -g status-justify left

## Contents
### Left
set-option -g status-left-length 100
set-option -g status-style 'fg=#{@foreground}, bg=#{@background}'
set-option -g status-left '#[reverse] H #[noreverse] #H '

### Windows
set-window-option -g window-status-format " #I "
set-window-option -g window-status-current-format "#[reverse] #I #[noreverse]"
set-window-option -g window-status-current-style default

### Right
set-option -g status-right-length 100
set-option -g status-right '#[reverse] S #[noreverse] #S #[reverse] T #[noreverse] %Y-%m-%d %H:%M '

# Pane Borders
set-option -g pane-border-style 'fg=#{@background}'
set-option -g pane-active-border-style 'fg=#{@background}'
